name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Blocking. The warn-instead-of-fail hedge that used to be here was
      # written for projects that pin heavy ML wheels; this one needs fastapi,
      # uvicorn, python-multipart, groq and gTTS, and if those will not
      # install then nothing below this line means anything.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile all sources
        run: python -m compileall -q .

      # Non-blocking, and that is a deliberate difference from the steps
      # around it: style findings should not stop a release, and they are
      # annotated on the diff either way.
      - name: Lint
        run: |
          pip install ruff
          ruff check --output-format=github . || echo "::warning::ruff reported issues"

      # This step used to be guarded by
      #   if ls test_*.py tests/ **/test_*.py >/dev/null 2>&1
      # and `ls` exits non-zero when any argument is missing. There is no
      # test_*.py at the repo root, so the guard was always false and the step
      # printed "no tests found" on every run while tests/test_app.py sat
      # there. Run them.
      - name: Tests
        run: pytest -q
